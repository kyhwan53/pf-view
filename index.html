const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LOCK='<button onclick="try{localStorage.removeItem(\'pfv-key\')}catch(e){};location.reload()" '+
  'style="position:fixed;right:14px;bottom:14px;z-index:99;font:600 13px system-ui,sans-serif;padding:9px 14px;'+
  'border-radius:999px;border:1px solid #8886;background:#1a1a19;color:#f0efec;box-shadow:0 2px 10px #0004">🔒 잠그기</button>';
async function show(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.ct));
  const h=new TextDecoder().decode(pt).replace("</body>",LOCK+"</body>");
  // 로드가 끝나기 전에 document.open 하면 교체되지 않고 잠금 화면 아래에 덧붙여짐 → load 이후에 교체
  if(document.readyState!=="complete") await new Promise(r=>addEventListener("load",r,{once:true}));
  document.open(); document.write(h); document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
function ask(){document.getElementById("wait").hidden=true;document.getElementById("f").hidden=false;document.getElementById("pw").focus()}
(async()=>{let s=null;try{s=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
  if(s&&s.k&&s.exp>Date.now()){try{await show(await crypto.subtle.importKey("raw",b(s.k),"AES-GCM",true,["decrypt"]));return}catch(e){}}
  try{localStorage.removeItem(K)}catch(_){}
  ask();
})();
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();
  const err=document.getElementById("err"),btn=document.getElementById("btn");err.textContent="";btn.disabled=true;btn.textContent="여는 중…";
  try{const key=await derive(document.getElementById("pw").value);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.ct));   // 비밀번호 확인 후에만 저장
    if(document.getElementById("rem").checked){const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
      try{localStorage.setItem(K,JSON.stringify({k:btoa(String.fromCharCode(...raw)),exp:Date.now()+DAYS*864e5}))}catch(_){}}
    document.getElementById("pw").value="";
    await show(key);
  }catch(x){err.textContent="비밀번호가 맞지 않습니다.";btn.disabled=false;btn.textContent="열기"}
});
